services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-repository_ustp}
            DB_USERNAME: ${DB_USERNAME:-root}
            DB_PASSWORD: ${DB_PASSWORD:-root_secret}
        depends_on:
            db:
                condition: service_healthy

    db:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_secret}
            MYSQL_DATABASE: ${DB_DATABASE:-repository_ustp}
        # Published so `php artisan serve` running on the host can reach MySQL
        # at 127.0.0.1:${DB_HOST_PORT}. Change DB_HOST_PORT in .env if 3306 is taken.
        ports:
            - "${DB_HOST_PORT:-3306}:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent',
                ]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    mysql-data:
    vendor:
